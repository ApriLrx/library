<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 登录视图 -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <h1>图书管理系统</h1>
      <p class="subtitle">可视化操作台</p>

      <div class="login-section">
        <h2>登录</h2>
        <label>用户名<input id="login-username" placeholder="用户名"></label>
        <label>密码<input id="login-password" type="password" placeholder="密码"></label>
        <div class="row">
          <button class="primary" onclick="doLogin()">登录</button>
          <button onclick="fillAdmin()">填入 admin</button>
        </div>
        <p class="hint">管理员账号：admin / admin123456</p>
      </div>

      <hr>

      <div class="login-section">
        <h2>注册读者</h2>
        <label>用户名<input id="reg-username" placeholder="5-50 个字符"></label>
        <label>密码<input id="reg-password" type="password" placeholder="10-20 位，含字母和数字"></label>
        <div class="row">
          <button class="primary" onclick="doRegister()">注册</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="app-view" class="app-wrap" style="display:none">
    <aside class="sidebar">
      <div class="brand">📚 图书管理</div>
      <nav id="menu"></nav>
      <div class="sidebar-footer">
        <div id="user-info"></div>
        <button class="ghost" onclick="logout()">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <div id="content"></div>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- 提示 -->
  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
